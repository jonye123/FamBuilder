[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fambuilder"
version = "0.1.0"
description = "Iterative HMM-based gene family classification pipeline. Generalized from Noor Mashiana's GrassFam."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"

authors = [
    { name = "Jon Ye", email = "yezuc18@email.com" }
]

dependencies = [
    "biopython>=1.79",
    "pandas>=1.5",
    "numpy>=1.23",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
plots = [
    "matplotlib>=3.6",
    "seaborn>=0.12",
    "scipy>=1.9",
    "networkx>=2.8",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
fambuilder = "fambuilder.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fambuilder = [
    "scripts/*.sh",
]